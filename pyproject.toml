[project]
name = "docintel"
version = "0.1.0"
description = "Answers questions about Indian government tender documents with citations, refuses when the documents don't support an answer, and measures itself."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "elasticsearch>=8.15,<9",
    "pymupdf>=1.25",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "anthropic>=0.75",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "reportlab>=4.2",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[tool.uv]
package = false

# CPU-only PyTorch: the CUDA wheels are ~2 GB and this runs on a CPU server.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "models: loads the embedding / reranking models (slow on first run)",
    "es: needs Elasticsearch",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
