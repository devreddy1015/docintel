<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocIntel · Ask tender documents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --bg:#f6f7f9; --surface:#fff; --line:#e3e6eb; --ink:#0f1729; --ink2:#4a5468; --ink3:#7b8496; --brand:#1c5cab; --soft:#e8f1fd; --bad:#c22f2f; --good:#0a7d0a; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#0b0e14; --surface:#131821; --line:#262d3a; --ink:#f2f4f8; --ink2:#b4bccb; --ink3:#828ba0; --brand:#5598e7; --soft:#12243d; --bad:#f07171; --good:#3ec43e; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, system-ui, sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; letter-spacing:-0.02em; margin: 0 0 4px; }
  .sub { color: var(--ink2); margin: 0 0 24px; }
  form { background: var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; display:grid; gap:10px; }
  label { font-size: 13px; font-weight:600; }
  input, textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:end; }
  button { font:inherit; font-weight:600; border:0; border-radius:999px; padding:11px 20px; background:var(--brand); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { background: var(--surface); color: var(--ink2); border:1px solid var(--line); padding:5px 12px; font-weight:500; font-size:13px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:16px; }
  .status { display:inline-flex; gap:6px; align-items:center; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; background:var(--soft); color:var(--brand); }
  .status.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .status.good { color: var(--good); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .answer { font-size: 17px; margin: 10px 0 0; white-space: pre-wrap; }
  .draft { color: var(--ink3); }
  .cites { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .cite { font-size: 12px; background: var(--soft); color: var(--brand); border-radius: 8px; padding: 3px 8px; }
  details { margin-top: 12px; font-size: 14px; color: var(--ink2); }
  .hit { border-top:1px solid var(--line); padding:8px 0; }
  .muted { color: var(--ink3); font-size: 13px; }
  blockquote { margin:6px 0 0; padding-left:10px; border-left: 3px solid var(--line); color: var(--ink2); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Ask the tender documents</h1>
  <p class="sub">Answers come only from the documents, with the page they came from. If the documents don't say, it says so.</p>
  <form id="f">
    <div>
      <label for="q">Question</label>
      <textarea id="q" required minlength="3" maxlength="500" placeholder="How much bid security has to be paid?"></textarea>
    </div>
    <div class="row">
      <div><label for="t">Tender ID (optional, searches only that tender)</label><input id="t" placeholder="e.g. 2026_DDA_928692_1"></div>
      <button id="go">Ask</button>
    </div>
    <div class="examples" id="ex"></div>
  </form>
  <div id="out"></div>
  <p class="muted" style="margin-top:24px">Always confirm on the official portal before bidding. <a href="/docs">API docs</a></p>
</main>
<script>
const EX = ["How much bid security has to be paid?", "By when must bids be submitted?", "What minimum yearly turnover does a bidder need?", "What penalty applies if the work is completed late?", "What is the price variation formula?"];
const ex = document.getElementById("ex");
for (const e of EX) { const b = document.createElement("button"); b.type = "button"; b.textContent = e; b.onclick = () => { document.getElementById("q").value = e; }; ex.appendChild(b); }

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LABEL = { answered: ["Answered from the documents", "good"], abstained: ["Not in the documents", ""], no_context: ["No matching documents", ""], rejected: ["Draft rejected by the fact check", "bad"], refused: ["Declined", "bad"], error: ["Error", "bad"] };

document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"); go.disabled = true;
  const out = document.getElementById("out");
  out.innerHTML = `<div class="card"><span class="status">Searching…</span><p class="answer draft" id="a"></p><div class="cites" id="c"></div><details id="d"><summary>Passages used</summary></details></div>`;
  const a = document.getElementById("a"), c = document.getElementById("c"), d = document.getElementById("d"), st = out.querySelector(".status");
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: document.getElementById("q").value, tender_id: document.getElementById("t").value || null }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.detail || r.statusText); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = block.split("\n").find((l) => l.startsWith("data: "));
        if (!data) continue;
        const ev = JSON.parse(data.slice(6));
        if (ev.type === "retrieval") { st.textContent = "Writing…"; for (const h of ev.hits) d.insertAdjacentHTML("beforeend", `<div class="hit"><b>${esc(h.filename)}</b>, ${esc(h.pages)} <span class="muted">${esc(h.heading)}</span></div>`); }
        else if (ev.type === "delta") a.textContent += ev.text;
        else if (ev.type === "final") {
          const [label, cls] = LABEL[ev.status] || [ev.status, ""];
          st.textContent = label; st.className = "status " + cls;
          a.className = "answer"; a.textContent = ev.answer;  // the draft is replaced by the checked answer
          c.innerHTML = ev.citations.map((x) => `<span class="cite" title="${esc(x.cited_text)}">${esc(x.document)}, p. ${x.page}</span>`).join("");
          if (ev.citations.length) a.insertAdjacentHTML("afterend", ev.citations.slice(0, 3).map((x) => `<blockquote>${esc(x.cited_text)}</blockquote>`).join(""));
          if (ev.status === "rejected" && ev.grounding) a.insertAdjacentHTML("afterend", `<p class="muted">Values not found in the cited passages: ${esc(ev.grounding.unsupported.join(", "))}</p>`);
        }
      }
    }
  } catch (err) { st.textContent = "Error"; st.className = "status bad"; a.className = "answer"; a.textContent = err.message; }
  go.disabled = false;
};
</script>
</body>
</html>
